services:
  mysql:
    image: mysql:8.0
    container_name: loomlot01-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: loomlot
      MYSQL_USER: loomlot
      MYSQL_PASSWORD: loomlot123
    ports:
      - "3309:3306"
    volumes:
      - loomlot01_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  backend:
    build: ./backend
    container_name: loomlot01-backend
    restart: unless-stopped
    environment:
      PORT: 8600
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: loomlot
      DB_PASSWORD: loomlot123
      DB_NAME: loomlot
      JWT_SECRET: loomlot-jwt-secret-change-me
      SEED_ON_START: "true"
    ports:
      - "8600:8600"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: loomlot01-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: loomlot01-nginx
    restart: unless-stopped
    ports:
      - "3600:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  loomlot01_mysql:
